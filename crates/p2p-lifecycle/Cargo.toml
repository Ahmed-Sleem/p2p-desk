[package]
name = "p2p-lifecycle"
version = "0.1.0"
description = "Fail-closed lifecycle and settings orchestration for P2P Desk"
authors = ["P2P Desk contributors"]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[dependencies]
p2p-domain = { path = "../p2p-domain" }
p2p-persistence = { path = "../p2p-persistence" }
p2p-provider = { path = "../p2p-provider" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
