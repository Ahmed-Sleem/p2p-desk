[package]
name = "p2p-domain"
version = "0.1.0"
description = "Exact deterministic domain and calculation core for P2P Desk"
authors = ["P2P Desk contributors"]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[dependencies]
fastnum = { version = "=0.7.5", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.20"

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
serde_json = "=1.0.151"
