[package]
name = "p2p-provider"
version = "0.1.0"
description = "Fail-closed Experimental Binance P2P Web adapter for P2P Desk"
authors = ["P2P Desk contributors"]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[dependencies]
p2p-domain = { path = "../p2p-domain" }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }

[dev-dependencies]
