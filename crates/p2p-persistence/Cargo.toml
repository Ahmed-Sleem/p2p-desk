[package]
name = "p2p-persistence"
version = "0.1.0"
description = "Atomic SQLite persistence, retention, migration, and backup core for P2P Desk"
authors = ["P2P Desk contributors"]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[dependencies]
fs2 = "=0.4.3"
getrandom = "=0.4.3"
hmac = "=0.13.0"
p2p-domain = { path = "../p2p-domain" }
p2p-provider = { path = "../p2p-provider" }
rusqlite = { version = "=0.40.2", features = ["backup", "bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
zip = { version = "=8.6.0", default-features = false }

[dev-dependencies]
